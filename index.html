<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rhedak</title>
  <meta name="description" content="Rhedak: open-source projects and fiction writing.">
  <meta property="og:title" content="Rhedak">
  <meta property="og:description" content="Open-source projects and fiction writing.">
  <meta property="og:image" content="https://github.com/rhedak.png?size=400">
  <meta name="theme-color" content="#14110f">
  <link rel="icon" href="https://github.com/rhedak.png?size=64">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="hero">
      <img id="avatar" class="avatar" src="https://github.com/rhedak.png?size=240" alt="" width="120" height="120">
      <h1 id="name">Rhedak</h1>
      <p id="tagline" class="tagline"></p>
      <p id="location" class="location"></p>
      <nav id="links" class="links" aria-label="Profiles"></nav>
    </header>

    <section aria-labelledby="games-h">
      <h2 id="games-h">Game</h2>
      <div id="games" class="cards"></div>
    </section>

    <section aria-labelledby="writing-h">
      <h2 id="writing-h">Writing</h2>
      <div id="writing" class="cards"></div>
    </section>

    <section aria-labelledby="projects-h">
      <h2 id="projects-h">Projects</h2>
      <div id="projects" class="cards"><p class="muted">Loading from GitHub…</p></div>
      <p class="more"><a id="all-repos" href="https://github.com/rhedak?tab=repositories">All repositories →</a></p>
    </section>

    <footer>© <span id="year"></span> Rhedak</footer>
  </main>
  <script src="site.config.js"></script>
  <script src="site.js"></script>
</body>
</html>
